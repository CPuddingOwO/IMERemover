pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// 应与项目文件夹名保持一致,否则 IDEA 可能报错(见 https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'IMERemover'
include('common')
include('fabric')
include('neoforge')