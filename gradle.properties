# 重要说明:
# 每添加一个字段,都需要同步添加到 buildSrc/src/main/groovy/multiloader-common.gradle 的 expandProps 中。

# 项目
version=1.0
group=net.cpudding
java_version=25

# 公共模块
# 本地开发默认构建此版本;CI 会读取仓库根目录的 versions.json,
# 对表中列出的每个 Minecraft 版本分别构建一份产物,新增/更新版本请同步修改该文件。
minecraft_version=26.2
mod_name=IMERemover
mod_author=CPuddingOwO
mod_id=imer
license=MIT
credits=
description=Remove IME for 26.1-snapshot-8+
# 最低支持版本为 26.1-snapshot-8(该快照首次引入 IME 支持),上界开放以覆盖 26.2 及更新的快照。
minecraft_version_range=[26.1-snapshot-8,)
## common 项目使用的 minecraft 版本,所有版本列表见
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric,新版本见 https://fabricmc.net/develop/
fabric_version=0.157.0+26.2
fabric_loader_version=0.19.3

# NeoForge,新版本见 https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.64
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false