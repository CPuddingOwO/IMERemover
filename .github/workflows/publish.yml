name: PUBLISH

on:
  workflow_dispatch:
    inputs:
      version:
        description: 模组版本号,例如 1.0.0
        required: true
        type: string
      release_type:
        description: 发布类型(与 Modrinth 的 Release/Alpha/Beta 对应,Alpha/Beta 会标记为预发布)
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Alpha
          - Beta

jobs:
  read-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      version: ${{ steps.version.outputs.value }}
      release_type: ${{ steps.version.outputs.type }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - id: read
        name: 读取版本表 versions.json
        run: echo "matrix=$(jq -c '.versions' versions.json)" >> "$GITHUB_OUTPUT"

      - id: version
        name: 计算版本号
        run: |
          VERSION="${{ inputs.version }}"
          TYPE="${{ inputs.release_type }}"
          if [ "$TYPE" != "Release" ]; then
            VERSION="${VERSION}-$(echo "$TYPE" | tr '[:upper:]' '[:lower:]')"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: read-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.read-versions.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Minecraft ${{ matrix.version.minecraft }}
        run: |
          ./gradlew build \
            -Pversion=${{ needs.read-versions.outputs.version }} \
            -Pminecraft_version=${{ matrix.version.minecraft }} \
            -Pfabric_loader_version=${{ matrix.version.fabric_loader }} \
            -Pfabric_version=${{ matrix.version.fabric_api }} \
            -Pneoforge_version=${{ matrix.version.neoforge }} \
            -Pneo_form_version=${{ matrix.version.neoform }}

      - name: 收集产物
        run: |
          mkdir -p artifacts
          for dir in fabric/build/libs neoforge/build/libs; do
            cp "$dir"/*.jar artifacts/ 2>/dev/null || true
          done
          rm -f artifacts/*-sources.jar artifacts/*-javadoc.jar

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: IMERemover-${{ matrix.version.minecraft }}
          path: artifacts/*.jar

  publish:
    runs-on: ubuntu-latest
    needs: [build, read-versions]
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: IMERemover-*
          path: artifacts
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.read-versions.outputs.version }}
          name: IMERemover v${{ needs.read-versions.outputs.version }}
          body: |
            由 GitHub Actions 自动构建发布
            支持 Minecraft 版本:见 versions.json
          files: artifacts/*.jar
          prerelease: ${{ needs.read-versions.outputs.release_type != 'Release' }}