name: RELEASE

on:
  release:
    types: [published]

jobs:
  read-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - id: read
        name: 读取版本表 versions.json
        run: echo "matrix=$(jq -c '.versions' versions.json)" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: read-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.read-versions.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 获取版本号(去掉标签前的 v)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 编译 Minecraft ${{ matrix.version.minecraft }}
        run: |
          ./gradlew build \
            -Pversion=${{ steps.version.outputs.version }} \
            -Pminecraft_version=${{ matrix.version.minecraft }} \
            -Pfabric_loader_version=${{ matrix.version.fabric_loader }} \
            -Pfabric_version=${{ matrix.version.fabric_api }} \
            -Pneoforge_version=${{ matrix.version.neoforge }} \
            -Pneo_form_version=${{ matrix.version.neoform }}

      - name: 收集产物
        run: |
          mkdir -p artifacts
          for dir in fabric/build/libs neoforge/build/libs; do
            cp "$dir"/*.jar artifacts/ 2>/dev/null || true
          done
          rm -f artifacts/*-sources.jar artifacts/*-javadoc.jar

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar